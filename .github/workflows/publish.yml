name: Build Docker for Android

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force build'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '0 0 * * 0'
  
permissions:
  contents: write
  actions: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Fetch tags
      run: git fetch --prune --unshallow --tags

    - name: Checkout Termux Code
      uses: actions/checkout@v4
      with:
        repository: mgksu/termux-packages
        fetch-depth: 1
        path: termux-packages
    
    - name: Get latest stable release from docker
      id: get_stable_release
      uses: octokit/request-action@v2.x
      with:
        route: GET /repos/moby/moby/releases/latest
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Get latest tag
      run: |
        latestTag="${{ fromJSON(steps.get_stable_release.outputs.data).tag_name }}"
        echo "Latest tag: $latestTag"
        echo "DOCKER_VERSION=${latestTag}" >> $GITHUB_ENV
    
    - name: Check Latest Version
      if: ${{ inputs.force == false }}
      run: |
        LATEST_VERSION=$(git describe --tags --abbrev=0 --always)
        if [ "$LATEST_VERSION" == "${{ env.DOCKER_VERSION }}" ]; then
          gh run cancel ${{ github.run_id }}
        else
          echo "New version found: ${LATEST_VERSION}"
        fi
      env:
       GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Download correct NDK and Build Docker
      run: |
        # 下载 Termux 需要的 NDK r27c
        cd /tmp
        wget -q https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
        unzip -q android-ndk-r27c-linux.zip
        sudo mkdir -p /opt/android-ndk
        sudo mv android-ndk-r27c /opt/android-ndk/
        
        cd $GITHUB_WORKSPACE/termux-packages
        patch -p1 < ../patches/docker.patch
        version="${{ env.DOCKER_VERSION }}"
        
        # 修复版本号和下载 URL
        sed -i "s|^TERMUX_PKG_VERSION=.*|TERMUX_PKG_VERSION=${version#docker-v}|" root-packages/docker/build.sh
        sed -i 's|https://github.com/moby/moby/archive/v\${TERMUX_PKG_VERSION}|https://github.com/moby/moby/archive/docker-v${TERMUX_PKG_VERSION}|g' root-packages/docker/build.sh
        
        # 删除或禁用 fix-paths-cli.patch（Docker v29 已经不需要这个补丁）
        if [ -f "root-packages/docker/fix-paths-cli.patch" ]; then
          mv root-packages/docker/fix-paths-cli.patch root-packages/docker/fix-paths-cli.patch.disabled
        fi
        
        # 同时从 build.sh 中移除对这个补丁的引用
        sed -i '/fix-paths-cli/d' root-packages/docker/build.sh
        
        # 修改 run-docker.sh 挂载正确的 NDK 并设置环境变量
        cp scripts/run-docker.sh scripts/run-docker.sh.bak
        sed -i "/--volume \$VOLUME/a \    --volume /opt/android-ndk/android-ndk-r27c:/home/builder/lib/android-ndk-r27c \\\\" scripts/run-docker.sh
        sed -i 's|exec --env "DOCKER_EXEC_PID_FILE_PATH=$DOCKER_EXEC_PID_FILE_PATH"|exec --env "DOCKER_EXEC_PID_FILE_PATH=$DOCKER_EXEC_PID_FILE_PATH" --env "ANDROID_NDK_HOME=/home/builder/lib/android-ndk-r27c" --env "NDK=/home/builder/lib/android-ndk-r27c"|' scripts/run-docker.sh
        
        ./scripts/run-docker.sh ./build-package.sh -i --format pacman docker docker-compose docker-buildx
        
        cd output
        bash ../../package_docker.sh
        mv docker.tar.xz ../../module/docker.tar.xz
        cd ..
        rm -rf termux-packages
    
    - name: Update module.prop
      run: |
          cd module
          version="${{ env.DOCKER_VERSION }}"
          version_code=$(echo "${version}" | sed 's/[^0-9]//g')
          echo "version=${version}" >> $GITHUB_ENV
          echo "versionCode=${version_code}" >> $GITHUB_ENV
          echo version=${version}
          echo versionCode=${version_code}
          
          echo "id=dockerd" > module.prop
          echo "name=Dockerd" >> module.prop
          echo "version=${version#v}" >> module.prop
          echo "versionCode=${version_code}" >> module.prop
          echo "author=repotitan" >> module.prop
          echo "description=Docker For Android" >> module.prop
          echo "updateJson=https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/update.json" >> module.prop
    

    - name: Create Module
      run: |
        mkdir -p dist
        cd module && zip -9 -r ../dist/Magisk-Dockerd-${{ env.version }}.zip ./
    
    - name: Set up Git
      run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

    - name: Push updated files to Main branch
      run: |
          echo '{
            "version": "${{ env.version }}",
            "versionCode": "${{ env.versionCode }}",
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/${{ env.version }}/Magisk-Dockerd-${{ env.version }}.zip",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }' > update.json
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release ${{ env.version }}"
            git push origin HEAD:main --force
            git tag ${{ env.version }}
            git push origin ${{ env.version }} -f
          fi

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        append_body: true
        generate_release_notes: true
        make_latest: true
        files: |
          ./dist/Magisk-Dockerd-${{ env.version }}.zip
        name: ${{ env.version }}
        tag_name: ${{ env.version }}
        draft: ${{ inputs.force == false }}

